name: Bug report
description: Something in PinDesk did not work as expected
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve PinDesk. Please do not include private paths you do not want shared.
  - type: input
    id: version
    attributes:
      label: PinDesk version
      description: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution and desktop environment
      description: e.g. Fedora 42 / KDE Plasma
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python3 --version`
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open PinDesk
        2. Select folder ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include Status messages or terminal output if available.
    validations:
      required: true
  - type: textarea
    id: preview
    attributes:
      label: Generated .desktop file
      description: Optional, from Show .desktop preview. Please remove sensitive paths.
      render: ini
    validations:
      required: false
