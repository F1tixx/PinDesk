<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PinDesk logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222731"/>
      <stop offset="1" stop-color="#121419"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c323d"/>
      <stop offset="1" stop-color="#20242c"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8cc2ff"/>
      <stop offset="0.45" stop-color="#5b9cf6"/>
      <stop offset="1" stop-color="#3b74c9"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33415f"/>
      <stop offset="1" stop-color="#26314a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b9cf6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5b9cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- App background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="3" y="3" width="506" height="506" rx="101" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="6"/>

  <!-- Desktop window -->
  <rect x="86" y="108" width="340" height="296" rx="26" fill="#0d0f13" opacity="0.55" filter="url(#soft)" transform="translate(0 10)"/>
  <rect x="86" y="108" width="340" height="296" rx="26" fill="url(#panel)" stroke="#434b59" stroke-width="4"/>
  <path d="M86 134a26 26 0 0 1 26-26h288a26 26 0 0 1 26 26v24H86z" fill="#38404c"/>
  <path d="M86 158h340" stroke="#20242c" stroke-width="4"/>
  <circle cx="116" cy="133" r="9" fill="#5b9cf6"/>
  <circle cx="146" cy="133" r="9" fill="#5b9cf6" opacity="0.55"/>

  <!-- Soft glow behind the pinned tile -->
  <circle cx="258" cy="312" r="104" fill="url(#glow)"/>

  <!-- Pinned app tile -->
  <rect x="196" y="252" width="124" height="124" rx="28" fill="#0a0c10" opacity="0.45" filter="url(#soft)" transform="translate(0 10)"/>
  <rect x="196" y="252" width="124" height="124" rx="28" fill="url(#tile)" stroke="#5b9cf6" stroke-opacity="0.7" stroke-width="4"/>
  <rect x="222" y="278" width="32" height="32" rx="9" fill="#5b9cf6" opacity="0.9"/>
  <rect x="262" y="278" width="32" height="32" rx="9" fill="#8cc2ff" opacity="0.75"/>
  <rect x="222" y="318" width="32" height="32" rx="9" fill="#8cc2ff" opacity="0.75"/>
  <rect x="262" y="318" width="32" height="32" rx="9" fill="#5b9cf6" opacity="0.9"/>

  <!-- Pushpin -->
  <g>
    <!-- needle -->
    <path d="M251 246h14l-7 62z" fill="#c8d2e0"/>
    <path d="M255 246h6l-4 62z" fill="#9aa7b8"/>
    <!-- shaft -->
    <path d="M234 176q5 34 17 70h14q12-36 17-70z" fill="url(#pin)" stroke="#2f5ea3" stroke-width="3"/>
    <!-- collar -->
    <rect x="228" y="168" width="60" height="14" rx="7" fill="#3b74c9"/>
    <rect x="228" y="168" width="60" height="6" rx="3" fill="#8cc2ff" opacity="0.45"/>
    <!-- head -->
    <circle cx="258" cy="138" r="40" fill="url(#pin)" stroke="#2f5ea3" stroke-width="3"/>
    <path d="M236 127a27 27 0 0 1 33-14" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="270" cy="152" rx="12" ry="7" fill="#2f5ea3" opacity="0.35"/>
  </g>
</svg>
